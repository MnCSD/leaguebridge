<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1D3150"/>
      <stop offset="0.55" stop-color="#0E1A2D"/>
      <stop offset="1" stop-color="#060B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#0AC8B9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0AC8B9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F6E4B6"/>
      <stop offset="0.5" stop-color="#C8AA6E"/>
      <stop offset="1" stop-color="#8E6C35"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AF0E6"/>
      <stop offset="1" stop-color="#0AC8B9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13243A"/>
      <stop offset="1" stop-color="#0A1424"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- App tile: rounded square with depth -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glow)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <path d="M136 26h240a110 110 0 0 1 110 110" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Teal glow behind the phone's screen -->
  <path d="M226 196 278 248 226 300 174 248z" fill="#0AC8B9" opacity="0.55" filter="url(#soft)"/>

  <!-- Phone -->
  <rect x="138" y="118" width="176" height="290" rx="40" fill="url(#screen)" stroke="url(#gold)" stroke-width="20"/>
  <rect x="202" y="372" width="48" height="11" rx="5.5" fill="#C8AA6E" opacity="0.85"/>

  <!-- Diamond on the screen -->
  <path d="M226 190 284 248 226 306 168 248z" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round" opacity="0.9"/>
  <path d="M226 216 258 248 226 280 194 248z" fill="url(#teal)"/>

  <!-- Signal waves: "remote" -->
  <path d="M352 196a74 74 0 0 1 0 104" fill="none" stroke="url(#teal)" stroke-width="20" stroke-linecap="round"/>
  <path d="M392 156a132 132 0 0 1 0 184" fill="none" stroke="url(#teal)" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
</svg>
